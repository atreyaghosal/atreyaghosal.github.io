title: Atreya Ghosal
description: "Made with <b style=\"color: var(--error);\">&lt;3</b>"
permalink: /:title/
lang: "en"
excerpt_separator: "\n\n\n"
date_format: "%B %d, %Y"

intro: "PhD researcher with the UtahNLP group at the University of Utah. I work on safe, trustworthy and human-aligned AI, currently on aligning language models to broad, narrative-level value systems."

# Layout

show_excerpts: true        # show article excerpts on the home page

# Menu

navigation:                # accepts {file, title, url, icon, sidebaricon}
  - {file: "README.md"}
  - {file: "index.html"}
  - {file: "cv.md"}

external:                  # shows a footer with social links - for available icons see fontawesome.com/icons
  - {title: Email, icon: envelope, url: "mailto:atreya.ghosal@utah.edu"}
  - {title: GitHub, icon: github, url: "https://github.com/AdLucem"}

comments:
#  disqus_shortname: ""    # see https://disqus.com/
#  isso_domain: ""         # see https://posativ.org/isso/

plugins:
 - jekyll-feed

# Setting this replaces Jekyll's default list, so the defaults are repeated.
# Repo docs and wiki/ are listed because Pages renders front-matter-less .md
# files too, and neither is meant to be public.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - AGENTS.md
  - CLAUDE.md
  - DOCS.md
  - wiki
